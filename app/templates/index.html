<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TranscribeAgent Portal | API Keys</title>
    <!-- Premium Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #0b0f19;
            --bg-card: #151c2c;
            --border-color: #222d44;
            --border-focus: #3b82f6;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2.5rem 1.5rem;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* Header section */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .logo svg {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 1rem;
        }

        .nav-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .nav-btn:hover {
            border-color: var(--accent);
            background-color: rgba(59, 130, 246, 0.08);
        }

        /* Main layout grid */
        .layout-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .layout-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Cards styling */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 0.75rem;
        }

        /* Form styling */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-input {
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.6rem 0.8rem;
            font-size: 0.9rem;
            color: var(--text-main);
            outline: none;
            font-family: var(--font-sans);
            transition: border-color 0.2s ease;
        }

        .form-input:focus {
            border-color: var(--border-focus);
        }

        .btn-submit {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.7rem;
            font-weight: 700;
            font-size: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        /* Keys list rendering */
        .keys-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 520px;
            overflow-y: auto;
        }

        .key-item {
            background-color: rgba(0,0,0,0.15);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            transition: border-color 0.2s ease;
        }

        .key-item:hover {
            border-color: rgba(255, 255, 255, 0.1);
        }

        .key-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .key-owner {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .key-status {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 0.15rem 0.45rem;
            border-radius: 99px;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .key-status.active {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .key-status.inactive {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .key-status-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
        }
        .key-status.active .key-status-dot { background-color: var(--success); }
        .key-status.inactive .key-status-dot { background-color: var(--danger); }

        .key-string-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background-color: rgba(0, 0, 0, 0.3);
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .key-string {
            font-family: var(--font-mono);
            font-size: 0.775rem;
            color: var(--text-secondary);
            flex-grow: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-action {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.2rem;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .btn-action:hover {
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Quota Bar style */
        .key-quota-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.725rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .quota-bar-bg {
            width: 100%;
            height: 5px;
            background-color: rgba(255,255,255,0.05);
            border-radius: 3px;
            overflow: hidden;
        }

        .quota-bar-fill {
            height: 100%;
            background-color: var(--success);
            border-radius: 3px;
        }

        .quota-bar-fill.warning { background-color: #f59e0b; }
        .quota-bar-fill.danger { background-color: var(--danger); }

        .key-item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            border-top: 1px dashed rgba(255,255,255,0.04);
            padding-top: 0.5rem;
            margin-top: 0.25rem;
        }

        .btn-toggle {
            font-size: 0.725rem;
            font-weight: 600;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-toggle:hover {
            border-color: var(--text-secondary);
            color: var(--text-main);
        }

        /* Notification Toast */
        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background-color: #ffffff;
            color: #000000;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 1000;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.2s ease;
            pointer-events: none;
        }

        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                TranscribeAgent Portal
            </div>
            <div class="nav-links">
                <a href="/docs" target="_blank" class="nav-btn">
                    API Docs (OpenAPI)
                </a>
                <a href="/llms.txt" target="_blank" class="nav-btn">
                    llms.txt
                </a>
            </div>
        </header>

        <!-- Content Grid -->
        <div class="layout-grid">
            <!-- Left Pane: Create Key -->
            <div class="card">
                <h3 class="card-title">Create API Key</h3>
                
                <div class="form-group">
                    <label class="form-label" for="owner">Owner / Agent Name</label>
                    <input type="text" id="owner" class="form-input" placeholder="e.g. TranslationBot" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="rpm">Rate Limit (RPM)</label>
                    <input type="number" id="rpm" class="form-input" value="60" min="1">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="quota">Quota Limit (USD)</label>
                    <input type="number" id="quota" class="form-input" value="10.0" step="1.0" min="1.0">
                </div>
                
                <button class="btn-submit" onclick="createKey()">Generate API Key</button>
            </div>

            <!-- Right Pane: Active Workspace Keys -->
            <div class="card">
                <h3 class="card-title" style="display:flex; justify-content:space-between; align-items:center;">
                    API Keys
                    <button class="btn-action" onclick="loadKeys()" title="Refresh API Keys" style="padding:0.4rem;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                    </button>
                </h3>
                
                <div class="keys-list" id="keysContainer">
                    <!-- Loaded dynamically -->
                    <div style="font-size:0.85rem; color:var(--text-secondary); text-align:center; padding:3rem 0;">
                        Loading API keys...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast">Key copied to clipboard!</div>

    <script>
        let keysList = [];

        // Load active keys from server
        async function loadKeys() {
            try {
                const response = await fetch('/v1/keys');
                if (response.ok) {
                    keysList = await response.json();
                    renderKeys();
                } else {
                    showToast("Failed to retrieve API keys.", true);
                }
            } catch (err) {
                console.error(err);
                showToast("Connection error while loading keys.", true);
            }
        }

        // Render the keys list
        function renderKeys() {
            const container = document.getElementById('keysContainer');
            container.innerHTML = '';
            
            if (keysList.length === 0) {
                container.innerHTML = `
                    <div style="font-size:0.85rem; color:var(--text-muted); text-align:center; padding:3rem 0;">
                        No API Keys created yet. Use the generator on the left to create one.
                    </div>
                `;
                return;
            }

            keysList.forEach(key => {
                const quotaPercent = Math.min(100, (key.quota_used_usd / key.quota_limit_usd) * 100);
                let quotaClass = '';
                if (quotaPercent > 85) quotaClass = 'danger';
                else if (quotaPercent > 50) quotaClass = 'warning';

                const keyItem = document.createElement('div');
                keyItem.className = 'key-item';
                
                const maskedKey = key.key.substring(0, 7) + '...' + key.key.substring(key.key.length - 4);
                
                keyItem.innerHTML = `
                    <div class="key-item-header">
                        <span class="key-owner">${escapeHtml(key.owner)}</span>
                        <span class="key-status ${key.is_active ? 'active' : 'inactive'}">
                            <span class="key-status-dot"></span>
                            ${key.is_active ? 'Active' : 'Inactive'}
                        </span>
                    </div>
                    
                    <div class="key-string-row">
                        <span class="key-string">${maskedKey}</span>
                        <button class="btn-action" onclick="copyKey('${key.key}')" title="Copy Full Key">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </button>
                    </div>

                    <div style="display:flex; flex-direction:column; gap:0.25rem;">
                        <div class="key-quota-info">
                            <span>Quota usage:</span>
                            <span>$${key.quota_used_usd.toFixed(4)} / $${key.quota_limit_usd.toFixed(1)}</span>
                        </div>
                        <div class="quota-bar-bg">
                            <div class="quota-bar-fill ${quotaClass}" style="width: ${quotaPercent}%"></div>
                        </div>
                    </div>

                    <div class="key-item-footer">
                        <span>Rate: ${key.rate_limit_rpm} RPM</span>
                        <button class="btn-toggle" onclick="toggleKey(${key.id}, ${key.is_active})">
                            ${key.is_active ? 'Deactivate' : 'Activate'}
                        </button>
                    </div>
                `;
                container.appendChild(keyItem);
            });
        }

        // Create new API Key
        async function createKey() {
            const ownerInput = document.getElementById('owner');
            const rpmInput = document.getElementById('rpm');
            const quotaInput = document.getElementById('quota');

            const owner = ownerInput.value.trim();
            const rpm = parseInt(rpmInput.value) || 60;
            const quota = parseFloat(quotaInput.value) || 10.0;

            if (!owner) {
                showToast("Please enter an owner name.", true);
                return;
            }

            try {
                const response = await fetch('/v1/keys', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ owner, rate_limit_rpm: rpm, quota_limit_usd: quota })
                });

                if (response.ok) {
                    const newKeyObj = await response.json();
                    showToast(`Created key for ${newKeyObj.owner}!`);
                    
                    // Copy to clipboard immediately
                    navigator.clipboard.writeText(newKeyObj.key);
                    showToast("API Key copied to clipboard!");
                    
                    // Reset input
                    ownerInput.value = '';
                    loadKeys();
                } else {
                    showToast("Failed to create key.", true);
                }
            } catch (err) {
                console.error(err);
                showToast("Connection error while creating key.", true);
            }
        }

        // Toggle Key status (activate / deactivate)
        async function toggleKey(id, currentStatus) {
            try {
                const response = await fetch(`/v1/keys/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ is_active: !currentStatus })
                });

                if (response.ok) {
                    showToast(`API Key status updated.`);
                    loadKeys();
                } else {
                    showToast("Failed to update status.", true);
                }
            } catch (err) {
                console.error(err);
                showToast("Connection error while toggling status.", true);
            }
        }

        // Copy Key helper
        function copyKey(keyValue) {
            navigator.clipboard.writeText(keyValue).then(() => {
                showToast("Copied to clipboard!");
            });
        }

        // Floating Toast Notice
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.backgroundColor = isError ? 'var(--danger)' : '#ffffff';
            toast.style.color = isError ? '#ffffff' : '#000000';
            toast.className = 'show';
            setTimeout(() => {
                toast.className = '';
            }, 2500);
        }

        // Escape HTML to prevent XSS
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Initial Load
        window.addEventListener('DOMContentLoaded', loadKeys);
    </script>
</body>
</html>
